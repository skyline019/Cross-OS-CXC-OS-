name: Diagnose prior crash test

on:
  push:
    branches:
      - arena/51cbdfde-cross-os-cxc-os

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Summarize the failed xv6 crash test
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess

          p = subprocess.run(['gh', 'run', 'view', '40658535773', '--log-failed'],
                             text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          if p.returncode:
              print(f'::warning title=Prior run logs::Download failed with exit {p.returncode}')
              raise SystemExit(1)
          lines = p.stdout.splitlines()
          attempts = [line for line in lines if re.search(r'log attempt\s+\d+', line)]
          interesting = [line for line in lines
                         if any(s in line for s in ('Test recovery', 'log attempt',
                                                    'FAIL', 'no qemu', 'panic:',
                                                    'recovering tail', 'Process completed'))]
          print(f'::notice title=Prior xv6 crash run::log_attempts={len(attempts)}')
          for line in interesting[-8:]:
              line = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=Prior xv6 crash run::{line[-800:]}')
          PY
