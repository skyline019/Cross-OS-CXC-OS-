name: xv6 and PMFS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CPUS: 3
    steps:
      - uses: actions/checkout@v7
      - name: Install RISC-V toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu qemu-system-riscv bc
      - name: Install pinned formatter
        run: |
          python3 -m venv "$RUNNER_TEMP/formatter"
          "$RUNNER_TEMP/formatter/bin/pip" install clang-format==21.1.8
          echo "$RUNNER_TEMP/formatter/bin" >> "$GITHUB_PATH"
      - name: Format and whitespace
        run: |
          make fmt
          git diff --exit-code
          git diff --check
      - name: Build default kernel
        run: make -j2 kernel/kernel fs.img
      - name: Repeated-boot benchmark validation and smoke
        run: |
          python3 -m unittest discover -s tools -p test_bench_repro.py
          python3 -m unittest discover -s tools -p test_bench_perf.py
          python3 -m unittest discover -s tools -p test_bench_gc_hints.py
          python3 -m unittest discover -s tools -p test_pmfs_trace_replay.py
          python3 -m unittest discover -s tools -p test_check_storage_topology.py
          python3 -m unittest discover -s tools -p test_nvme_trace_audit.py
          python3 -m unittest discover -s tools -p test_nvme_boot_tests.py
          python3 -m unittest discover -s tools -p 'test_*directcore*.py'
          python3 tools/bench_repro.py --runs 2 --warmup 0 --n 4 --output .ci-logs/bench-smoke --build-notes 'CI default GCC kernel, QEMU TCG'
          python3 tools/bench_perf.py --runs 2 --warmup 0 --samples 4 --sizes 64 --modes roundtrip,overwrite --output .ci-logs/perf-smoke --build-notes 'CI default GCC kernel, QEMU TCG'
      - name: xv6 usertests, three harts
        run: ./test-xv6.py usertests
      - name: VFS namespace, descriptors and atomic rename, three harts
        run: ./test-xv6.py vfs
      - name: PMFS write avoidance and indexed query regression
        run: ./test-xv6.py efficiency
      - name: PMFS explicit compaction and metadata reclamation
        run: make test-pmfs-gc
      - name: Native log oracle unit tests
        run: python3 -m unittest discover -s tools -p test_xv6_log_recovery.py
      - name: Default kernel rejects native log fault injection
        run: CPUS=1 XV6_LOG_DIR=.ci-logs/xv6-default python3 tools/xv6_log_recovery.py --expect-disabled
      - name: xv6 deterministic block-log and orphan recovery, one hart
        run: CPUS=1 XV6_LOG_DIR=.ci-logs/xv6-crash-cpu1 make test-xv6-crash
      - name: Native same-directory rename log recovery and negative control
        run: python3 tools/native_rename_recovery.py --cpus 1 --log-dir .ci-logs/native-rename
      - name: xv6 deterministic block-log recovery, three harts
        run: CPUS=3 XV6_LOG_DIR=.ci-logs/xv6-crash-cpu3 ./test-xv6.py log
      - name: xv6 concurrent block-log writes and readback
        run: CPUS=3 ./test-xv6.py stress
      - name: Destructive EMUL selftests and matched-workload smoke
        run: CPUS=1 make contract-full
      - name: Destructive MAP selftests
        run: CPUS=1 make contract-pmem
      - name: Shared-RAM magic smoke (not hardware power loss)
        run: CPUS=1 make contract-pmem2
      - name: Matched-count benchmark smoke
        run: CPUS=1 make bench-sweep
      - name: Bounded persist specification model and negative controls
        run: make test-model
      - name: PMFS restart, corruption and software fault-boundary oracle
        run: make test-recovery RECOVERY_ARGS="--log-dir .ci-logs/recovery"
      - name: VFS rename, hard links and dual-slot reclamation restart
        run: python3 tools/vfs_recovery.py --log-dir .ci-logs/vfs-recovery
      - name: COW compaction and deferred run reclamation restart
        run: python3 tools/pmfs_gc_recovery.py --log-dir .ci-logs/gc-recovery
      - name: Zicbom instruction-path oracle on QEMU TCG
        run: make test-recovery-zicbom RECOVERY_ARGS="--log-dir .ci-logs/zicbom"
      - name: Actual PMFS operation trace replay and negative controls (sampled model)
        run: make test-trace-replay
      - name: Compaction low-space preflight (tiny disposable EMUL device)
        run: make test-pmfs-gc-nospace
      - name: Native NVMe root, fail-closed cases and log recovery
        run: |
          make clean
          make -j2 DISK=nvme EXTRA_CFLAGS="-DXV6_LOG_FAULT_INJECT" kernel/kernel fs.img
          python3 tools/nvme_boot_tests.py --cpus 3 --log-dir .ci-logs/nvme-boot
          python3 tools/xv6_log_recovery.py --backend nvme --cpus 1 --log-dir .ci-logs/nvme-log
          python3 tools/native_rename_recovery.py --backend nvme --cpus 1 --log-dir .ci-logs/nvme-rename
          XV6_TEST_OUTPUT=.ci-logs/nvme-vfs.log DISK=nvme CPUS=3 ./test-xv6.py 'test_vfs$'
          XV6_TEST_OUTPUT=.ci-logs/nvme-stress.log DISK=nvme CPUS=3 ./test-xv6.py 'test_stress$'
          XV6_TEST_OUTPUT=.ci-logs/nvme-usertests.log DISK=nvme CPUS=3 ./test-xv6.py -q 'test_usertests$'
      - name: Upload test serial logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-test-serial-logs
          path: |
            .ci-logs/
            test-xv6.out
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  nvdimm:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CPUS: 3
    steps:
      - uses: actions/checkout@v7
      - name: Install QEMU build dependencies and RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu bc ninja-build meson python3-venv \
            libglib2.0-dev libpixman-1-dev libfdt-dev
      - name: Build experimental QEMU 9.2.0 virt NVDIMM patch
        run: |
          curl --fail --location --retry 3 https://download.qemu.org/qemu-9.2.0.tar.xz -o "$RUNNER_TEMP/qemu.tar.xz"
          tar -xJf "$RUNNER_TEMP/qemu.tar.xz" -C "$RUNNER_TEMP"
          patch -d "$RUNNER_TEMP/qemu-9.2.0" -p1 < tools/patches/qemu-9.2.0-riscv-pmfs-nvdimm.patch
          mkdir "$RUNNER_TEMP/qemu-build"
          cd "$RUNNER_TEMP/qemu-build"
          "$RUNNER_TEMP/qemu-9.2.0/configure" --target-list=riscv64-softmmu --disable-docs \
            --disable-werror --disable-tools --disable-user --disable-guest-agent \
            --disable-gtk --disable-sdl --disable-vnc --disable-slirp --disable-plugins
          ninja -j2 qemu-system-riscv64
      - name: Verify distinct QEMU NVDIMM via QMP
        run: |
          python3 tools/check_nvdimm_device.py --qemu "$RUNNER_TEMP/qemu-build/qemu-system-riscv64"
          python3 tools/check_storage_topology.py --qemu "$RUNNER_TEMP/qemu-build/qemu-system-riscv64"
      - name: NVDIMM process-restart and fault-boundary oracle
        run: make test-recovery-nvdimm QEMU="$RUNNER_TEMP/qemu-build/qemu-system-riscv64" RECOVERY_ARGS="--log-dir .ci-logs/nvdimm"
      - name: VFS namespace and dual-slot reclamation on NVDIMM
        run: python3 tools/vfs_recovery.py --nvdimm --qemu "$RUNNER_TEMP/qemu-build/qemu-system-riscv64" --log-dir .ci-logs/vfs-nvdimm
      - name: COW compaction and reclamation on NVDIMM
        run: python3 tools/pmfs_gc_recovery.py --nvdimm --qemu "$RUNNER_TEMP/qemu-build/qemu-system-riscv64" --log-dir .ci-logs/gc-nvdimm
      - name: NVDIMM with Zicbom instruction path
        run: make test-recovery-nvdimm-zicbom QEMU="$RUNNER_TEMP/qemu-build/qemu-system-riscv64" RECOVERY_ARGS="--log-dir .ci-logs/nvdimm-zicbom"
      - name: VFS namespace and dual-slot reclamation with Zicbom
        run: python3 tools/vfs_recovery.py --nvdimm --zicbom --qemu "$RUNNER_TEMP/qemu-build/qemu-system-riscv64" --log-dir .ci-logs/vfs-nvdimm-zicbom
      - name: COW compaction and reclamation with Zicbom
        run: python3 tools/pmfs_gc_recovery.py --nvdimm --zicbom --qemu "$RUNNER_TEMP/qemu-build/qemu-system-riscv64" --log-dir .ci-logs/gc-nvdimm-zicbom
      - name: NVMe root and existing v3 PMFS on NVDIMM, together
        run: |
          make clean
          make -j2 DISK=nvme EXTRA_CFLAGS="-DPMEM_MAP -DPMEM_NVDIMM -DPMFS_FAULT_INJECT" kernel/kernel fs.img
          python3 tools/nvme_trace_audit.py --qemu "$RUNNER_TEMP/qemu-build/qemu-system-riscv64" \
            --output .ci-logs/nvme-trace
          python3 tools/pmfs_recovery.py --nvdimm --backend nvme --cpus 3 \
            --qemu "$RUNNER_TEMP/qemu-build/qemu-system-riscv64" --log-dir .ci-logs/nvdimm-nvme
          python3 tools/vfs_recovery.py --nvdimm --backend nvme --cpus 3 \
            --qemu "$RUNNER_TEMP/qemu-build/qemu-system-riscv64" --log-dir .ci-logs/vfs-nvdimm-nvme
          python3 tools/pmfs_gc_recovery.py --nvdimm --backend nvme --cpus 3 \
            --qemu "$RUNNER_TEMP/qemu-build/qemu-system-riscv64" --log-dir .ci-logs/gc-nvdimm-nvme
          python3 tools/bench_perf.py --nvdimm --backend nvme --runs 2 --warmup 0 \
            --samples 4 --sizes 64 --modes overwrite --output .ci-logs/nvdimm-nvme-perf-smoke \
            --qemu "$RUNNER_TEMP/qemu-build/qemu-system-riscv64" \
            --build-notes 'CI QEMU 9.2 NVDIMM + NVMe; existing v3, fault hooks dormant'
      - name: Direct-core compile guard, Zicbom recovery and trace replay
        run: |
          make clean
          mkdir -p .ci-logs
          if make DISK=nvme DIRECT_CORE=1 EXTRA_CFLAGS="-DPMEM_MAP -DPMEM_NVDIMM -DPMFS_SELFTEST" kernel/directcore.o > .ci-logs/directcore-guard.log 2>&1; then
            echo 'destructive legacy selftest guard unexpectedly compiled' >&2
            exit 1
          fi
          grep -F 'DIRECT_CORE_TEST forbids destructive legacy PMFS selftests' .ci-logs/directcore-guard.log
          make clean
          make -j2 DISK=nvme DIRECT_CORE=1 EXTRA_CFLAGS="-DPMEM_MAP -DPMEM_NVDIMM -DPMEM_ZICBOM -DDIRECT_CORE_FAULT_INJECT -DPMFS_TRACE" kernel/kernel fs.img
          python3 tools/check_directcore_store.py --output .ci-logs/directcore-store-isa.json
          python3 tools/directcore_recovery.py --backend nvme --cpus 3 --zicbom \
            --qemu "$RUNNER_TEMP/qemu-build/qemu-system-riscv64" --log-dir .ci-logs/directcore
          trace=$(find .ci-logs/directcore -maxdepth 1 -name '*-trace-update.log' -print)
          test -f "$trace"
          python3 tools/directcore_trace_replay.py --backend nvme --cpus 3 --zicbom \
            --qemu "$RUNNER_TEMP/qemu-build/qemu-system-riscv64" \
            --baseline .ci-logs/directcore/trace-baseline.pmem.gz \
            --final .ci-logs/directcore/trace-final.pmem.gz --trace "$trace" \
            --output .ci-logs/directcore-trace-replay
          python3 tools/directcore_boundary_recovery.py --backend nvme --cpus 3 --zicbom --random-steps 8 \
            --qemu "$RUNNER_TEMP/qemu-build/qemu-system-riscv64" --output .ci-logs/directcore-boundaries
      - name: Direct-core ENOSPC and disabled fault-injection checks
        run: |
          make clean
          make -j2 DISK=nvme DIRECT_CORE=1 EXTRA_CFLAGS="-DPMEM_MAP -DPMEM_NVDIMM -DDIRECT_CORE_LINE_LIMIT=14" kernel/kernel fs.img
          python3 tools/directcore_enospc.py --backend nvme \
            --qemu "$RUNNER_TEMP/qemu-build/qemu-system-riscv64" --log-dir .ci-logs/directcore-enospc
      - name: Direct-core paired throughput smoke (not a hardware benchmark)
        run: |
          make clean
          make -j2 DISK=nvme DIRECT_CORE=1 EXTRA_CFLAGS="-DPMEM_MAP -DPMEM_NVDIMM -DPMEM_ZICBOM" kernel/kernel fs.img
          python3 tools/directcore_bench.py --runs 2 --warmup 0 --samples 4 --sizes 64 --zicbom \
            --qemu "$RUNNER_TEMP/qemu-build/qemu-system-riscv64" --output .ci-logs/directcore-bench-smoke \
            --build-notes 'CI smoke only, GCC, QEMU TCG, trace and fault injection not compiled'
      - name: Upload NVDIMM serial logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nvdimm-serial-logs
          path: .ci-logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: brew install riscv64-elf-gcc
      - run: make -j2 kernel/kernel fs.img
