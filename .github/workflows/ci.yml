name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2

jobs:
  linux-uefi-qemu:
    name: Linux (UEFI + QEMU + contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 \
            cmake python3 qemu-system-x86 ovmf

      - name: Configure Debug (-Werror)
        run: >-
          cmake -S . -B build/uefi-debug
          -DCMAKE_TOOLCHAIN_FILE=cmake/x86_64-uefi-mingw.cmake
          -DCMAKE_BUILD_TYPE=Debug
          -DCXC_WARNINGS_AS_ERRORS=ON

      - name: Build Debug kernel and ESP
        run: cmake --build build/uefi-debug --parallel

      - name: Configure Release (-Werror)
        run: >-
          cmake -S . -B build/uefi
          -DCMAKE_TOOLCHAIN_FILE=cmake/x86_64-uefi-mingw.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DCXC_WARNINGS_AS_ERRORS=ON

      - name: Build Release kernel and ESP
        run: cmake --build build/uefi --parallel

      - name: Host C++ net protocol tests (ctest)
        run: |
          cmake -S tests/host -B build/host-tests
          cmake --build build/host-tests --parallel
          ctest --test-dir build/host-tests --output-on-failure

      - name: Host net tests under ASan / UBSan / TSan
        run: |
          set -euo pipefail
          for san in address undefined thread; do
            cmake -S tests/host -B "build/host-${san}" \
              -DCXC_HOST_SANITIZER="${san}"
            cmake --build "build/host-${san}" --parallel
            ctest --test-dir "build/host-${san}" --output-on-failure
          done

      - name: Host-side test contract
        run: >-
          python3 tools/contract_test.py --host-only
          --work-dir build/contract-host

      - name: Default qemu-test (PASS + peer_ok)
        run: cmake --build build/uefi --target qemu-test

      - name: Assert serial PASS, M13–M57 markers, peer_ok=1
        run: |
          set -euo pipefail
          test -f build/uefi/qemu-test/serial.log
          test -f build/uefi/qemu-test/network-peer.log
          grep -F 'CXC_OS_SELF_TEST_PASS' build/uefi/qemu-test/serial.log
          grep -F 'UDP Echo request/reply: 10/10' build/uefi/qemu-test/serial.log
          grep -F 'UDP socket demux deliver/recv: 10/10' build/uefi/qemu-test/serial.log
          grep -F 'UDP stress request/reply: 256/256' build/uefi/qemu-test/serial.log
          grep -F 'UDP stress socket demux deliver/recv: 256/256' \
            build/uefi/qemu-test/serial.log
          grep -F 'UDP socket TX submit: 1/1, bytes: 60, heads/tails: 6/6' \
            build/uefi/qemu-test/serial.log
          grep -F 'UDP socket TX backpressure: posted: 7, rejects: 1, drained: 1, heads/tails: 5/5' \
            build/uefi/qemu-test/serial.log
          grep -F 'UDP socket TX wait: waits: 1, posted: 1, drained: 1, events: 1, heads/tails: 5/5' \
            build/uefi/qemu-test/serial.log
          grep -F 'UDP IRQ RX demux deliver/echo/recycle: 266/266/266' \
            build/uefi/qemu-test/serial.log
          grep -F 'UDP IRQ RX submit: 266' \
            build/uefi/qemu-test/serial.log
          grep -F 'user AS probe: cr3_switch: 1, write: 1, read: 1, user_bit: 1, va: 0x0000000000400000' \
            build/uefi/qemu-test/serial.log
          grep -F 'ring3 probe: enter: 1, int80: 1, cpl: 3, rsp0: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_PROGRAM_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user ELF: loaded: 1, enter: 1, exit: 1, pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_FS_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user FS: open: 2, read: 1, write: 1, close: 2, pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_BRK_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user brk: grow: 1, pages: 1, pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_MMAP_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user mmap: calls: 1, pages: 1, pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_DIR_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user dir: mkdir: 1, open: 2, dirs: 1, pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_MUNMAP_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user munmap: mmap: 1, munmap: 1, pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_EXT_ELF_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user ext ELF: loaded: 1, enter: 1, exit: 1, pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_CROSS_ELF_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user cross ELF: loaded: 1, enter: 1, exit: 1, pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_LSEEK_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user lseek: calls: 3, pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_FSTAT_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user fstat: calls: 1, pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_STAT_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user stat: calls: 2, pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_GETDENTS_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user getdents: calls: 2, pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_ARCH_PRCTL_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user arch_prctl: calls: 2, pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_LIBC_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user libc: write: 1, pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_LIBC_FS_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user libc fs: open: 2, pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_LIBC_SBRK_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user libc sbrk: grow: 1, pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_LIBC_MALLOC_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user libc malloc: grow: 2, pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'USER_LIBC_ERRNO_PASS' build/uefi/qemu-test/serial.log
          grep -F 'user libc errno: pass: 1' \
            build/uefi/qemu-test/serial.log
          grep -F 'peer_ok=1' build/uefi/qemu-test/network-peer.log
          grep -F 'udp_stress_replies_validated=256' \
            build/uefi/qemu-test/network-peer.log

      - name: Memory layout matrix
        run: |
          python3 tools/run_qemu.py --image build/uefi/cxc-os.img \
            --check --memory 64M --work-dir build/qemu-64m
          python3 tools/run_qemu.py --image build/uefi/cxc-os.img \
            --check --memory 256M --work-dir build/qemu-256m
          python3 tools/run_qemu.py --image build/uefi/cxc-os.img \
            --check --cpu "qemu64,+x2apic" --memory 512M \
            --work-dir build/qemu-512m-dma-mask

      - name: xAPIC and x2APIC
        run: |
          python3 tools/run_qemu.py --image build/uefi/cxc-os.img \
            --check --cpu "qemu64,-x2apic" --work-dir build/qemu-xapic
          python3 tools/run_qemu.py --image build/uefi/cxc-os.img \
            --check --cpu "qemu64,+x2apic" --work-dir build/qemu-x2apic

      - name: SMP UP, 8-way (xAPIC+x2APIC), and 16-way
        run: |
          # UP needs extra time: M18 held-lock sleeps force mutex waits.
          # 16-way needs event_waiter_capacity >= cpu_count+1 (fixed M25 CI).
          # 8-way xAPIC exercises ICR Delivery Status + TLB shootdown IPI retry.
          python3 tools/run_qemu.py --image build/uefi/cxc-os.img \
            --check --cpus 1 --cpu "qemu64,+x2apic" --timeout 120 \
            --work-dir build/qemu-up
          python3 tools/run_qemu.py --image build/uefi/cxc-os.img \
            --check --cpus 8 --cpu "qemu64,-x2apic" --timeout 120 \
            --work-dir build/qemu-smp-8-xapic
          python3 tools/run_qemu.py --image build/uefi/cxc-os.img \
            --check --cpus 8 --cpu "qemu64,+x2apic" --timeout 120 \
            --work-dir build/qemu-smp-8
          python3 tools/run_qemu.py --image build/uefi/cxc-os.img \
            --check --cpus 16 --cpu "qemu64,+x2apic" --memory 512M \
            --timeout 120 --work-dir build/qemu-smp-16

      - name: Negative — missing EDU
        run: >-
          python3 tools/run_qemu.py --image build/uefi/cxc-os.img
          --check --no-edu --expect "CXC_OS_PANIC: EDU MSI/DMA"
          --work-dir build/qemu-no-edu

      - name: Negative — missing e1000e
        run: >-
          python3 tools/run_qemu.py --image build/uefi/cxc-os.img
          --check --no-e1000e --expect "CXC_OS_PANIC: e1000e MSI-X"
          --work-dir build/qemu-no-e1000e

      - name: Full midpoint test contract
        run: >-
          python3 tools/contract_test.py
          --image build/uefi/cxc-os.img
          --work-dir build/contract-full

      - name: Summarize Linux evidence
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          roots = [
              Path("build/uefi/BOOTX64.efi"),
              Path("build/uefi/cxc-os.img"),
              Path("build/uefi-debug/BOOTX64.efi"),
              Path("build/contract-host/CONTRACT_VALIDATION.txt"),
              Path("build/uefi/qemu-test/serial.log"),
              Path("build/uefi/qemu-test/network-peer.log"),
              Path("build/contract-full/CONTRACT_VALIDATION.txt"),
          ]
          # Always required once earlier steps produced them.
          required = {
              Path("build/uefi/BOOTX64.efi"),
              Path("build/uefi/cxc-os.img"),
              Path("build/contract-host/CONTRACT_VALIDATION.txt"),
              Path("build/uefi/qemu-test/serial.log"),
              Path("build/uefi/qemu-test/network-peer.log"),
          }
          lines = []
          missing_required = False
          for path in roots:
              if not path.is_file():
                  lines.append(f"MISSING {path}")
                  if path in required:
                      missing_required = True
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path}  ({path.stat().st_size} bytes)")
          Path("build/linux-evidence-summary.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          print("\n".join(lines))
          # Only fail this step on required gaps; optional contract-full may be
          # absent when an earlier matrix step already failed.
          if missing_required:
              raise SystemExit("required evidence files missing")
          PY

      - name: Upload Linux evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-uefi-qemu-evidence
          path: |
            build/uefi/BOOTX64.efi
            build/uefi/cxc-os.img
            build/linux-evidence-summary.txt
            build/contract-host/**
            build/uefi/qemu-test/serial.log
            build/uefi/qemu-test/network-peer.log
            build/contract-full/CONTRACT_VALIDATION.txt
            build/contract-full/contract-report.json
            build/contract-full/SHA256SUMS
            build/contract-full/logs/**
            build/contract-full/qemu/**/serial.log
            build/contract-full/qemu/**/network-peer.log
          if-no-files-found: error

  windows-uefi-build:
    name: Windows (MSYS2 build + host contract)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-python

      - name: Configure Release (-Werror)
        shell: msys2 {0}
        run: >-
          cmake -S . -B build/uefi -G "MinGW Makefiles"
          -DCMAKE_TOOLCHAIN_FILE=cmake/x86_64-uefi-mingw.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DCXC_WARNINGS_AS_ERRORS=ON

      - name: Build kernel and ESP
        shell: msys2 {0}
        run: cmake --build build/uefi --parallel

      - name: Check artifacts non-empty
        shell: msys2 {0}
        run: >-
          python3 -c
          "from pathlib import Path; e=Path('build/uefi/BOOTX64.efi'); i=Path('build/uefi/cxc-os.img'); assert e.stat().st_size > 0 and i.stat().st_size > 0; print(e, e.stat().st_size, i, i.stat().st_size)"

      - name: Host C++ net protocol tests (ctest)
        shell: msys2 {0}
        run: |
          cmake -S tests/host -B build/host-tests
          cmake --build build/host-tests --parallel
          ctest --test-dir build/host-tests --output-on-failure

      - name: Host-side test contract
        shell: msys2 {0}
        run: >-
          python3 tools/contract_test.py --host-only
          --work-dir build/contract-host

      - name: Summarize Windows evidence
        shell: msys2 {0}
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          roots = [
              Path("build/uefi/BOOTX64.efi"),
              Path("build/uefi/cxc-os.img"),
              Path("build/contract-host/CONTRACT_VALIDATION.txt"),
              Path("build/contract-host/contract-report.json"),
          ]
          lines = []
          for path in roots:
              if not path.is_file():
                  lines.append(f"MISSING {path}")
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path}  ({path.stat().st_size} bytes)")
          Path("build/windows-evidence-summary.txt").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          print("\n".join(lines))
          if any(line.startswith("MISSING ") for line in lines):
              raise SystemExit("required evidence files missing")
          PY

      - name: Upload Windows build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-uefi-build-evidence
          path: |
            build/uefi/BOOTX64.efi
            build/uefi/cxc-os.img
            build/windows-evidence-summary.txt
            build/contract-host/**
          if-no-files-found: error
